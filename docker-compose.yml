services:
  backend:
    build:
      context: ./backend
    container_name: pokemon-backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POKEAPI_URL: "https://pokeapi.co/api/v2"

  frontend:
    build:
      context: ./frontend
    container_name: pokemon-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: "http://backend:8080"
    depends_on:
      - backend
